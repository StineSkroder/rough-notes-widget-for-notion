<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rough Notes</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .card {
    box-sizing: border-box;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    border: 1px solid #e6e6e6;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }

  .clear-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    color: #6b6b6b;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 6px;
  }

  .clear-btn:hover {
    background: #f4f4f4;
    color: #333;
  }

  .clear-btn:focus {
    outline: none;
    box-shadow: none;
  }

  .counts {
    color: #9a9a9a;
    font-size: 12px;
    white-space: nowrap;
  }

  .counts b {
    color: #6b6b6b;
    font-weight: 600;
  }

  .note-area {
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    box-shadow: none;
    resize: none;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
    background: transparent;
    font-family: inherit;
  }

  .note-area:focus {
    outline: none;
    box-shadow: none;
  }

  .note-area::placeholder {
    color: #b3b3b3;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <button class="clear-btn" id="clearBtn" title="Clear notes">
      🧹 Clear
    </button>
    <div class="counts">
      <b id="wordCount">0</b> words &nbsp; <b id="charCount">0</b> chars
    </div>
  </div>
  <textarea class="note-area" id="noteArea" placeholder="Type your rough notes here..."></textarea>
</div>

<script>
(function () {
  // Every Notion page embedding this widget should use a unique ?id=
  // query parameter so notes don't sync across pages, e.g. ?id=math-notes-ch3
  var params = new URLSearchParams(window.location.search);
  var pageId = params.get('id') || 'default';
  var NOTES_KEY = 'rough-notes-' + pageId;

  var noteArea = document.getElementById('noteArea');
  var wordCountEl = document.getElementById('wordCount');
  var charCountEl = document.getElementById('charCount');
  var clearBtn = document.getElementById('clearBtn');

  function updateCounts() {
    var text = noteArea.value;
    var words = text.trim().length ? text.trim().split(/\s+/).length : 0;
    wordCountEl.textContent = words;
    charCountEl.textContent = text.length;
  }

  noteArea.value = localStorage.getItem(NOTES_KEY) || '';
  updateCounts();

  noteArea.addEventListener('input', function () {
    localStorage.setItem(NOTES_KEY, noteArea.value);
    updateCounts();
  });

  clearBtn.addEventListener('click', function () {
    noteArea.value = '';
    localStorage.removeItem(NOTES_KEY);
    updateCounts();
    noteArea.focus();
  });
})();
</script>

</body>
</html>
