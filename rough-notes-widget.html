<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Rough Notes</title>
<style>
  :root {
    color-scheme: light dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .card {
    box-sizing: border-box;
    width: 100vw;
    height: 100vh;
    background: transparent;
    border: 1px solid rgba(128, 128, 128, 0.28);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(128, 128, 128, 0.18);
    flex-shrink: 0;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 6px 16px;
    border-top: 1px solid rgba(128, 128, 128, 0.18);
    flex-shrink: 0;
  }

  .clear-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    color: #8a8a8a;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background 0.1s ease, color 0.1s ease;
  }

  .clear-btn:hover {
    background: rgba(128, 128, 128, 0.14);
    color: #444;
  }

  .clear-btn:focus {
    outline: none;
    box-shadow: none;
  }

  .counts {
    color: #9a9a9a;
    font-size: 12px;
    white-space: nowrap;
  }

  .counts b {
    color: #7a7a7a;
    font-weight: 600;
  }

  .note-area {
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    box-shadow: none;
    resize: none;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
    background: transparent;
    font-family: inherit;
  }

  .note-area:focus {
    outline: none;
    box-shadow: none;
  }

  .note-area::placeholder {
    color: #b3b3b3;
  }

  /* --- adapt to dark mode --- */
  @media (prefers-color-scheme: dark) {
    .card {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .note-area {
      color: #e8e8e8;
    }

    .note-area::placeholder {
      color: #7a7a7a;
    }

    .clear-btn {
      color: #b0b0b0;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f0f0f0;
    }

    .counts {
      color: #8a8a8a;
    }

    .counts b {
      color: #bdbdbd;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <button class="clear-btn" id="clearBtn" title="Clear notes">
      🧹 Clear
    </button>
  </div>
  <textarea class="note-area" id="noteArea" placeholder="Type your rough notes here..."></textarea>
  <div class="footer">
    <div class="counts">
      <b id="wordCount">0</b> words &nbsp; <b id="charCount">0</b> chars
    </div>
  </div>
</div>

<script>
(function () {
  // Every Notion page embedding this widget should use a unique ?id=
  // query parameter so notes don't sync across pages, e.g. ?id=math-notes-ch3
  var params = new URLSearchParams(window.location.search);
  var pageId = params.get('id') || 'default';
  var NOTES_KEY = 'rough-notes-' + pageId;

  var noteArea = document.getElementById('noteArea');
  var wordCountEl = document.getElementById('wordCount');
  var charCountEl = document.getElementById('charCount');
  var clearBtn = document.getElementById('clearBtn');

  function updateCounts() {
    var text = noteArea.value;
    var words = text.trim().length ? text.trim().split(/\s+/).length : 0;
    wordCountEl.textContent = words;
    charCountEl.textContent = text.length;
  }

  noteArea.value = localStorage.getItem(NOTES_KEY) || '';
  updateCounts();

  noteArea.addEventListener('input', function () {
    localStorage.setItem(NOTES_KEY, noteArea.value);
    updateCounts();
  });

  clearBtn.addEventListener('click', function () {
    noteArea.value = '';
    localStorage.removeItem(NOTES_KEY);
    updateCounts();
    noteArea.focus();
  });
})();
</script>

</body>
</html>
